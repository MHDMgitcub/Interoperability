<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipe List</title>
</head>
<body>
    <h2>Recipes</h2>

    {% if recipes %}
        <table border="1">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Importance</th>
                    <th>Creation date</th>
                </tr>
            </thead>
            <tbody>
                {% for recipe in recipes %}
                    <tr>
                        <td><a href="{{ url_for('recipe_details', recipe_id=recipe['id']) }}">{{ recipe["name"] }}</a></td>
                        <td>{{ recipe["type"] }}</td>
                        <td>{{ recipe["importance"] }}</td>
                        <td>{{ recipe["creation_date"] }}</td>     
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No recipes found.</p>
    {% endif %}
</body>
</html>
